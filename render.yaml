# Render.com free-tier deployment of the backend API. See
# docs/FREE_TIER_DEPLOYMENT.md for the full investigation/measurements this
# is based on, and the live deployment record (real URLs, live verification
# results). Deploy: Render dashboard -> New -> Blueprint -> select this
# repo -> it reads this file.
#
# Live URLs (as of the live verification in docs/FREE_TIER_DEPLOYMENT.md):
#   Backend:  https://securecode-ai-backend.onrender.com
#   Frontend: https://securecode-ai.vercel.app
services:
  - type: web
    name: securecode-ai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://securecode-ai.vercel.app
