# Render.com free-tier deployment of the backend API. See
# docs/FREE_TIER_DEPLOYMENT.md for the full investigation/measurements this
# is based on. Deploy: Render dashboard -> New -> Blueprint -> select this
# repo -> it reads this file.
#
# After the service is up, set CORS_ALLOWED_ORIGINS below to the real
# deployed Vercel URL (the placeholder here will reject the frontend's
# requests until you do) and update frontend/.env's VITE_API_BASE_URL (or
# the Vercel project's env var) to this service's real onrender.com URL.
services:
  - type: web
    name: securecode-ai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app
