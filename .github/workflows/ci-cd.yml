# =============================================================================
# ci-cd.yml -- SecureCode AI: validate, test, and scan pipeline.
#
# Developer pushes code
#         |
#         v
#   GitHub Actions triggered
#         |
#   +----------------------+----------------------+
#   |                      |                       |
#   backend-validation      frontend-validation      (run in parallel)
#   |                      |                       |
#   +----------------------+----------------------+
#                          |
#                          v
#                   security-scan
#         (only on pull_request/workflow_dispatch, and only
#          if BOTH jobs above passed -- see docs/CI_CD.md #2/#4)
#                          |
#                          v
#                   final-status
#      (always runs; reports one clear overall result)
#
# See docs/CI_CD.md for the full policy, rationale, and how to run every
# one of these steps locally before pushing.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      scan_blocking:
        description: "Fail the job if a CRITICAL finding is present (default: report-only, non-blocking -- see docs/CI_CD.md #5)"
        type: boolean
        default: false

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Python syntax check (compileall)
        run: python -m compileall -q app backend src

      - name: Import validation (build the FastAPI app)
        working-directory: backend
        run: python -c "import main; print(f'{len(main.app.routes)} routes registered OK')"

      - name: ML model artifact validation
        working-directory: backend
        run: |
          python -c "
          import os, sys, joblib
          from xgboost import XGBClassifier

          root = os.path.dirname(os.getcwd())
          xgb_path = os.path.join(root, 'models', 'xgboost.json')
          rf_path = os.path.join(root, 'models', 'random_forest.joblib')
          meta_path = os.path.join(root, 'models', 'training_metadata.json')

          missing = [p for p in (xgb_path, rf_path, meta_path) if not os.path.exists(p)]
          if missing:
              print('Missing model artifact(s):', missing)
              print('These are committed directly in this repo (no Git LFS) -- a fresh')
              print('checkout should always have them. If this fails, the checkout is')
              print('incomplete or the artifacts were removed from version control.')
              sys.exit(1)

          xgb = XGBClassifier()
          xgb.load_model(xgb_path)
          rf = joblib.load(rf_path)
          print(f'XGBoost loaded OK ({len(xgb.get_booster().get_dump())} trees)')
          print(f'Random Forest loaded OK ({len(rf.estimators_)} trees)')
          "

      - name: Backend tests
        working-directory: backend
        run: pytest tests/ -v

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b

      - name: Production build
        working-directory: frontend
        run: npx vite build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

  security-scan:
    name: Security scan
    needs: [backend-validation, frontend-validation]
    # Only on a PR (changed-files scan) or a manual run (full-repo scan) --
    # deliberately NOT on every push to main. See docs/CI_CD.md #2 for why
    # this is an honest scope limitation, not an oversight.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      # codeql-action/upload-sarif calls the Actions API to correlate the
      # SARIF file with this workflow run; without this it 403s with
      # "Resource not accessible by integration" (observed on this repo's
      # first real PR run, 29905887615).
      actions: read
    env:
      # Non-blocking by default (see docs/CI_CD.md #5). A pull_request run
      # reads the repo variable SCAN_BLOCKING (Settings -> Secrets and
      # variables -> Actions -> Variables); a manual run can override it via
      # the workflow_dispatch input above. Either way this defaults to
      # 'false' if nothing is set.
      SCAN_BLOCKING: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.scan_blocking) || vars.SCAN_BLOCKING || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history only when we need to diff against the PR base --
          # a shallow clone can't compute that diff.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache CodeBERT weights (~1GB, avoids re-downloading from HuggingFace every run)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: codebert-base-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compute changed files (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          # Defensive fetch: the auto-generated PR merge ref checked out above
          # can momentarily lag behind a base branch that was updated right
          # before this run (observed in practice: fetch-depth 0 checked out
          # a merge commit whose parent chain didn't yet include the base
          # SHA reported in the event payload, causing `git diff` to fail
          # with "fatal: bad object"). Fetching both SHAs explicitly makes
          # this step correct regardless of that timing.
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" || true
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            > changed_files.txt
          echo "Changed files in this PR:"
          cat changed_files.txt

      - name: Run security scan -- changed files only (pull_request)
        if: github.event_name == 'pull_request'
        working-directory: backend
        # Exit code respects $SCAN_BLOCKING (set at job level above) --
        # non-blocking by default. Downstream steps use if: always() so the
        # report/SARIF/PR-comment steps still run even when this fails.
        run: python ci_scan.py --files-from ../changed_files.txt --path .. --output ../security-report --fail-on CRITICAL

      - name: Run security scan -- full repository (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: backend
        run: python ci_scan.py --path .. --output ../security-report --fail-on CRITICAL

      - name: Write scan summary
        if: always()
        run: |
          if [ -f security-report.md ]; then
            {
              echo "## SecureCode AI Security Scan"
              echo ""
              cat security-report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No security-report.md was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF to the Security tab
        if: always()
        # Non-blocking: GitHub's code-scanning/Security-tab feature requires
        # GitHub Advanced Security, which isn't purchasable for a private
        # repo under a personal (non-Enterprise) account -- this step will
        # always fail with "Code scanning is not enabled for this
        # repository" on such a repo (observed on this repo's first real PR
        # run, 29906616569), regardless of the permissions granted above.
        # The actual scan results are still captured via the report artifact
        # (below) and the PR comment, so this is a nice-to-have, not the
        # core scan output -- it shouldn't sink an otherwise-passing run.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-report.sarif

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            security-report.md
            security-report.json
            security-report.sarif
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- securecode-ai-scan-comment -->';

            let body = `${marker}\n## SecureCode AI -- Security Scan\n\nNo \`security-report.json\` was produced (the scan step may have failed before writing it).`;

            if (fs.existsSync('security-report.json')) {
              const r = JSON.parse(fs.readFileSync('security-report.json', 'utf8'));
              const b = r.risk_breakdown || {};
              body = [
                marker,
                '## SecureCode AI -- Security Scan',
                '',
                `**Files scanned:** ${r.total_files} (${r.scan_mode}) &middot; **Model mode:** \`${r.model_mode}\` &middot; **Blocking:** ${r.blocking ? 'YES' : 'NO (report-only)'}`,
                '',
                `**ML baseline status:** ${r.ml_baseline_status_line}`,
                '',
                '| Critical | High | Medium | Low | Safe |',
                '|---|---|---|---|---|',
                `| ${b['CRITICAL'] || 0} | ${b['HIGH RISK'] || 0} | ${b['MEDIUM RISK'] || 0} | ${b['LOW RISK'] || 0} | ${b['SAFE'] || 0} |`,
                '',
                r.total_files === 0
                  ? '_No `.c`/`.cpp`/`.h` files changed in this PR._'
                  : `See the **security-scan** job summary or the Security tab for per-file findings. Full details in the \`security-scan-report\` build artifact.`,
                '',
                '_This is a research-scale classifier (see docs/CI_CD.md), not a mature rule engine -- treat findings as a signal to review, not a certification._',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  final-status:
    name: Final status
    needs: [backend-validation, frontend-validation, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report overall pipeline result
        run: |
          echo "## Pipeline Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend validation | ${{ needs.backend-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend validation | ${{ needs.frontend-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security scan | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.backend-validation.result }}" != "success" ] || \
             [ "${{ needs.frontend-validation.result }}" != "success" ] || \
             ( [ "${{ needs.security-scan.result }}" != "success" ] && [ "${{ needs.security-scan.result }}" != "skipped" ] ); then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Overall: FAILED** -- see the failing job(s) above for details." >> "$GITHUB_STEP_SUMMARY"
            echo "Overall: FAILED"
            exit 1
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Overall: PASSED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Overall: PASSED"
          fi
