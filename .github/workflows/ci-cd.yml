# =============================================================================
# ci-cd.yml -- SecureCode AI: build, test, and scan pipeline.
#
# Pipeline shape:
#
#   Checkout
#     |
#     +--> [backend job]  Python setup (pip cache) -> install deps
#     |                   -> backend build check -> backend tests
#     |
#     +--> [frontend job] Node setup (npm cache)   -> install deps
#                         -> frontend build         -> frontend tests
#     |
#     v
#   [repository-scan job] (runs only if BOTH jobs above succeed)
#     Python setup (pip cache) -> install deps
#     -> run the existing CodeBERT/AST/Metrics/XGBoost pipeline over every
#        .c/.cpp/.h file in the repo (backend/ci_scan.py, unmodified)
#     -> upload the generated report as a workflow artifact
#     -> fail the job if any CRITICAL-risk file is found
#
# backend and frontend run in parallel (neither depends on the other).
# repository-scan is gated on both: if either build/test job fails, this
# job is skipped automatically (GitHub Actions' default `needs` behaviour),
# so a broken build never gets scanned or reported as passing.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend build check (import the FastAPI app)
        working-directory: backend
        run: python -c "import main; print(f'{len(main.app.routes)} routes registered OK')"

      - name: Backend tests
        working-directory: backend
        run: pytest tests/ -v

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

  repository-scan:
    name: Repository security scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run repository scan (real CodeBERT + AST + Metrics + XGBoost pipeline)
        working-directory: backend
        run: python ci_scan.py --path .. --output ../security-report

      - name: Write scan summary
        if: always()
        run: |
          if [ -f security-report.md ]; then
            {
              echo "## SecureCode AI Repository Scan"
              echo ""
              cat security-report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No security-report.md was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            security-report.md
            security-report.json
          if-no-files-found: warn
