# =============================================================================
# docker-compose.yml -- run the whole SecureCode AI platform with one
# command:  docker compose up --build
#
# Two services: backend (FastAPI + the existing trained ML pipeline) and
# frontend (the built React dashboard, served by nginx, proxying /api/* to
# the backend container). The SQLite database (backend/data/platform.db)
# persists in a named volume across restarts.
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: securecode-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - scan_data:/srv/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A cold start (no cached HuggingFace weights yet -- first run, or after
      # `docker compose down -v`/a fresh volume) downloads CodeBERT before
      # the app can serve /api/health, observed taking ~2.5-3 minutes on a
      # real run. 30s previously meant `docker ps` reported "unhealthy" for
      # a container that was actually fine, just still starting -- the app
      # itself was never broken (confirmed: real scans succeeded through it
      # during that window), only the healthcheck's timing was too tight.
      start_period: 200s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securecode-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  scan_data:
    driver: local
