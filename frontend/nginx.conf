server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same relative-URL contract the Vite dev proxy uses (see vite.config.ts)
    # so api/client.ts needs no changes between `npm run dev` and Docker.
    #
    # proxy_read_timeout must be >= VITE_SCAN_TIMEOUT_MS (frontend/.env.example,
    # currently 1200000ms / 20 min) -- a large real-world repo scan can
    # legitimately take minutes (measured: 797.5s for a 200-file GitHub scan,
    # see docs/PER_FUNCTION_INFERENCE_DESIGN.md), and nginx would otherwise cut
    # the connection at 120s regardless of the frontend's own, longer timeout.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1200s;
    }

    # Client-side routing (React Router) -- any unmatched path falls back
    # to index.html rather than a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
